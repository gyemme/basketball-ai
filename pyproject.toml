[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hoopstats"
version = "0.1.0"
description = "Youth basketball stats, shot charts and coaching insights from XbotGo game video"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pyyaml>=6",
  "scipy>=1.10",
  "pillow>=10",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
rfdetr = ["rfdetr>=1.2"]
mac = ["ocrmac>=1.0"]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = ["pytest>=7"]

[project.scripts]
hoopstats = "hoopstats.cli:main"

[tool.setuptools.packages.find]
include = ["hoopstats*"]

[tool.setuptools.package-data]
hoopstats = ["assets/*.npz", "report/template.html", "calibrate_ui.html"]
